const B=(en,bn)=>({en,bn});
const UI={title:B("Henry's Farm Adventures","হেনরির খামার অভিযান"),intro:B("Help Henry make smart choices as weather and growing conditions change. Learn how farmers adapt and use satellite clues.","আবহাওয়া ও চাষের অবস্থা বদলালে হেনরিকে ভালো সিদ্ধান্ত নিতে সাহায্য করুন। কৃষকের অভিযোজন ও স্যাটেলাইটের তথ্য সম্পর্কে জানুন।"),start:B("Start the adventure","অভিযান শুরু করুন"),note:B("A learning game, not a farm forecast. Real decisions depend on local conditions and advice.","এটি শেখার খেলা, খামারের আবহাওয়ার পূর্বাভাস নয়। বাস্তব সিদ্ধান্ত স্থানীয় পরিস্থিতি ও পরামর্শের ওপর নির্ভর করে।"),next:B("Continue","এগিয়ে চলুন"),know:B("What helps","যা কাজে আসে"),not:B("Keep in mind","মনে রাখুন"),sources:B("Learn more","আরও জানুন"),ask:B("🛰️ Ask Farm Science","🛰️ কৃষিবিজ্ঞান সহায়ক"),question:B('Ask e.g. “What does NDVI show?”','যেমন: “NDVI কী দেখায়?”'),search:B("Search","খুঁজুন"),close:B("Close","বন্ধ"),demo:B("Answers come from this small offline learning guide, not live NASA data or an AI model.","উত্তর এই ছোট অফলাইন শেখার নির্দেশিকা থেকে আসে; লাইভ NASA তথ্য বা AI থেকে নয়।"),none:B("No matching guide entry. Try drought, flood, heat, salt, satellite, soil, water, or crop.","মিল পাওয়া যায়নি। খরা, বন্যা, তাপ, লবণ, স্যাটেলাইট, মাটি, পানি বা ফসল লিখে দেখুন।"),right:B("Good plan","ভালো পরিকল্পনা"),wrong:B("There is a better option","আরও ভালো উপায় আছে"),myths:B("Farm science: fact or overclaim?","কৃষিবিজ্ঞান: তথ্য নাকি অতিরঞ্জন?"),done:B("Henry's season is complete!","হেনরির মৌসুম শেষ!"),again:B("Play again","আবার খেলুন"),score:B("Season skills","মৌসুমি দক্ষতা")};
const S=[
{icon:'🌱',place:B('Early season · Drought watch','মৌসুমের শুরু · খরার আশঙ্কা'),question:B('Rain has been scarce. Henry has limited water for the young crops. What is a sensible first step?','বৃষ্টি কম হয়েছে। চারার জন্য হেনরির পানি সীমিত। প্রথমে কোন পদক্ষেপটি যুক্তিসঙ্গত?'),choices:[[B('Check soil moisture and prioritize water for crops that need it most','মাটির আর্দ্রতা দেখে বেশি প্রয়োজন এমন ফসলে পানি অগ্রাধিকার দেয়'),1],[B('Flood every field on a fixed schedule','নির্দিষ্ট সময়ে সব জমিতে পানি ভাসিয়ে দেয়'),0],[B('Stop checking the fields and hope for rain','জমি দেখা বন্ধ করে বৃষ্টির অপেক্ষা করে'),0]],level:'good',topic:B('Drought and water','খরা ও পানি'),help:B('Monitoring soil moisture, repairing leaks and choosing efficient irrigation can help stretch scarce water. Mulch can reduce evaporation.','মাটির আর্দ্রতা দেখা, ফুটো মেরামত এবং কার্যকর সেচ সীমিত পানি কাজে লাগাতে সাহায্য করে। মালচ বাষ্পীভবন কমাতে পারে।'),caveat:B('The best irrigation plan depends on crop, soil, water access and local conditions.','সেরা সেচ পরিকল্পনা ফসল, মাটি, পানির সুযোগ ও স্থানীয় অবস্থার ওপর নির্ভর করে।'),src:'NASA Earth Observatory · FAO',keys:['drought','dry','water','irrigation','খরা','পানি','সেচ','শুকনো']},
{icon:'🌧️',place:B('Mid-season · Heavy rain','মাঝ-মৌসুম · ভারী বৃষ্টি'),question:B('Forecasts warn of heavy rain and possible flooding. How can Henry prepare?','পূর্বাভাসে ভারী বৃষ্টি ও বন্যার আশঙ্কা। হেনরি কীভাবে প্রস্তুতি নিতে পারে?'),choices:[[B('Clear drainage paths and move tools and seed to higher ground','নিষ্কাশনের পথ পরিষ্কার করে যন্ত্র ও বীজ উঁচু স্থানে রাখে'),1],[B('Block field drains so water stays on the crops','জমিতে পানি রাখতে নালা বন্ধ করে'),0],[B('Apply extra fertilizer just before floodwater arrives','বন্যার পানি আসার আগে বেশি সার দেয়'),0]],level:'good',topic:B('Flooding and drainage','বন্যা ও পানি নিষ্কাশন'),help:B('Keeping drains clear and protecting seed, equipment and soil can reduce avoidable losses. After flooding, check fields and follow local agricultural guidance.','নালা সচল রাখা এবং বীজ, যন্ত্র ও মাটি রক্ষা করলে এড়ানো যায় এমন ক্ষতি কমতে পারে। বন্যার পর জমি দেখে স্থানীয় কৃষি পরামর্শ নিন।'),caveat:B('Flood timing and impacts vary. Do not enter fast-moving or contaminated floodwater.','বন্যার সময় ও প্রভাব ভিন্ন হতে পারে। দ্রুত স্রোত বা দূষিত বন্যার পানিতে নামবেন না।'),src:'NASA Earth Observatory · FAO',keys:['flood','rain','drain','waterlogging','বন্যা','বৃষ্টি','নিষ্কাশন','জলাবদ্ধতা']},
{icon:'☀️',place:B('Hot spell · Crop stress','তাপপ্রবাহ · ফসলের চাপ'),question:B('Several very hot days are expected during flowering. What should Henry do?','ফুল আসার সময় কয়েক দিন প্রচণ্ড গরম পড়বে। হেনরির কী করা উচিত?'),choices:[[B('Check crop and soil conditions, then use available water carefully at cooler times','ফসল ও মাটির অবস্থা দেখে সম্ভব হলে ঠান্ডা সময়ে সতর্কভাবে পানি দেয়'),1],[B('Use the same amount of water everywhere, regardless of crop stage','ফসলের ধাপ না দেখে সবখানে সমান পানি দেয়'),0],[B('Assume heat cannot affect crops if the leaves are green','পাতা সবুজ থাকলে তাপ ফসলে প্রভাব ফেলে না ধরে নেয়'),0]],level:'context',topic:B('Heat stress','তাপজনিত চাপ'),help:B('High temperatures can stress crops, especially around sensitive growth stages. Local forecasts, soil moisture checks and suitable crop or planting choices can support adaptation.','উচ্চ তাপমাত্রা ফসলে চাপ সৃষ্টি করতে পারে, বিশেষত সংবেদনশীল বৃদ্ধির পর্যায়ে। স্থানীয় পূর্বাভাস, মাটির আর্দ্রতা দেখা এবং উপযোগী ফসল বা বপনের সময় অভিযোজনে সহায়তা করে।'),caveat:B('Responses vary by crop, variety, growth stage and local weather.','প্রতিক্রিয়া ফসল, জাত, বৃদ্ধির পর্যায় ও স্থানীয় আবহাওয়া অনুযায়ী ভিন্ন হয়।'),src:'NASA Climate · FAO',keys:['heat','hot','temperature','stress','তাপ','গরম','তাপমাত্রা']},
{icon:'🧂',place:B('Late season · Salty soil','মৌসুমের শেষ · লবণাক্ত মাটি'),question:B('Some plants are wilting and the field edge has a white crust. What is a useful response?','কিছু গাছ নেতিয়ে পড়েছে এবং জমির কিনারে সাদা আস্তরণ। কী করা কাজে লাগতে পারে?'),choices:[[B('Test soil and water, then ask local agricultural services about salt-tolerant options','মাটি ও পানির পরীক্ষা করে লবণসহিষ্ণু বিকল্পের জন্য স্থানীয় কৃষি দপ্তরে জিজ্ঞেস করে'),1],[B('Add more fertilizer without checking the cause','কারণ না জেনে আরও সার দেয়'),0],[B('Assume all white soil is harmless and ignore it','সাদা মাটি ক্ষতিকর নয় ধরে উপেক্ষা করে'),0]],level:'context',topic:B('Soil salinity','মাটির লবণাক্ততা'),help:B('Salt can make it harder for plants to take up water. Soil and irrigation-water testing can identify a problem; drainage and crop choices depend on local advice.','লবণ গাছের পানি শোষণ কঠিন করতে পারে। মাটি ও সেচের পানি পরীক্ষা সমস্যাটি বুঝতে সাহায্য করে; নিষ্কাশন ও ফসলের সিদ্ধান্ত স্থানীয় পরামর্শে নিন।'),caveat:B('A white crust alone does not confirm salinity. Test before changing soil or water management.','শুধু সাদা আস্তরণ দেখেই লবণাক্ততা নিশ্চিত হয় না। ব্যবস্থাপনা বদলানোর আগে পরীক্ষা করুন।'),src:'FAO · NASA Earth Observatory',keys:['salt','salinity','soil','salty','লবণ','লবণাক্ত','মাটি']},
{icon:'🛰️',place:B('Field check · Satellite view','জমি দেখা · স্যাটেলাইট চিত্র'),question:B('Henry sees a patch of low NDVI on a satellite crop map. What does that tell him?','স্যাটেলাইটের ফসলের মানচিত্রে হেনরি কম NDVI-র একটি অংশ দেখে। এর মানে কী?'),choices:[[B('It flags an area to investigate on the ground; it does not diagnose the cause','এটি জমিতে গিয়ে দেখার সংকেত; কারণ নির্ণয় করে না'),1],[B('It proves exactly which pest or disease is present','কোন পোকা বা রোগ আছে তা নিশ্চিত প্রমাণ করে'),0],[B('It guarantees the field will fail this season','এতে নিশ্চিত হয় যে এ মৌসুমে ফসল নষ্ট হবে'),0]],level:'context',topic:B('Satellite data and NDVI','স্যাটেলাইট তথ্য ও NDVI'),help:B('NDVI uses red and near-infrared light to indicate vegetation greenness and vigor. Maps can help identify patterns and changes over time.','NDVI লাল ও নিকট-অবলোহিত আলো ব্যবহার করে গাছপালার সবুজত্ব ও প্রাণশক্তির ইঙ্গিত দেয়। মানচিত্রে সময়ের সাথে পরিবর্তন ও বিন্যাস দেখা যায়।'),caveat:B('NDVI does not identify the cause of crop stress. Clouds, bare soil, crop stage and sensor resolution affect what a map shows; ground checks matter.','NDVI ফসলের চাপের কারণ বলে না। মেঘ, খোলা মাটি, ফসলের ধাপ ও সেন্সরের রেজোলিউশন মানচিত্রে প্রভাব ফেলে; জমিতে যাচাই জরুরি।'),src:'NASA Earthdata · NASA Harvest',keys:['ndvi','satellite','map','nasa','remote sensing','স্যাটেলাইট','মানচিত্র','এনডিভিআই']},
{icon:'🌾',place:B('Planning next season','পরের মৌসুমের পরিকল্পনা'),question:B('Henry wants the farm to cope better with uncertain weather next year. What is a strong planning approach?','অনিশ্চিত আবহাওয়া সামলাতে হেনরি আগামী বছরের জন্য কীভাবে পরিকল্পনা করবে?'),choices:[[B('Combine local forecasts, diverse crops, soil care and advice from agricultural experts','স্থানীয় পূর্বাভাস, ফসলের বৈচিত্র্য, মাটির যত্ন ও কৃষি বিশেষজ্ঞের পরামর্শ মিলিয়ে'),1],[B('Plant one crop everywhere because it worked once','একবার ভালো হয়েছিল বলে সর্বত্র এক ফসল লাগায়'),0],[B('Rely on a satellite image alone to choose all actions','সব সিদ্ধান্তে শুধু স্যাটেলাইট চিত্রের ওপর ভরসা করে'),0]],level:'good',topic:B('Resilient farming','সহনশীল কৃষি'),help:B('Climate-smart farming combines context-specific practices that sustain productivity, adapt to climate impacts and reduce avoidable environmental harm.','জলবায়ু-স্মার্ট কৃষিতে স্থানভিত্তিক এমন পদ্ধতি মিলিয়ে নেওয়া হয় যা উৎপাদন টিকিয়ে রাখে, জলবায়ুর প্রভাবের সাথে মানায় ও পরিবেশের অপ্রয়োজনীয় ক্ষতি কমায়।'),caveat:B('There is no single practice that fits every farm. Local knowledge and conditions guide the choices.','একটি পদ্ধতি সব খামারে মানায় না। স্থানীয় জ্ঞান ও পরিস্থিতি সিদ্ধান্তে পথ দেখায়।'),src:'FAO · NASA Climate',keys:['climate smart','resilience','crop','adapt','sustainable','ফসল','জলবায়ু','সহনশীল','টেকসই']}
];
const M=[
{claim:B('A low NDVI pixel proves a crop has a specific disease.','NDVI মান কম হলেই নির্দিষ্ট রোগ প্রমাণিত হয়।'),answer:'qual',why:B('Overclaim. NDVI can flag vegetation changes, but field checks are needed to investigate causes.','অতিরঞ্জিত। NDVI গাছপালার পরিবর্তনের ইঙ্গিত দিতে পারে, কারণ খুঁজতে জমিতে যাচাই দরকার।')},
{claim:B('Efficient irrigation and soil-moisture monitoring can help manage limited water.','কার্যকর সেচ ও মাটির আর্দ্রতা দেখা সীমিত পানি ব্যবস্থাপনায় সাহায্য করে।'),answer:'yes',why:B('Supported as useful practices; the right approach depends on local conditions.','উপকারী পদ্ধতি হিসেবে সমর্থিত; সঠিক উপায় স্থানীয় অবস্থার ওপর নির্ভর করে।')},
{claim:B('One crop variety is always best for every farm facing heat.','গরমের মুখে সব খামারে একই ফসলের জাত সবসময় সেরা।'),answer:'no',why:B('Not established. Crop and variety choices depend on climate, soil, water and local expertise.','প্রতিষ্ঠিত নয়। ফসল ও জাত বাছাই জলবায়ু, মাটি, পানি ও স্থানীয় দক্ষতার ওপর নির্ভরশীল।')},
{claim:B('Satellite maps can replace a farmer walking the field.','স্যাটেলাইট মানচিত্র কৃষকের জমি পরিদর্শনের বিকল্প।'),answer:'no',why:B('No. Satellite information complements ground observations; it does not replace them.','না। স্যাটেলাইট তথ্য জমি পর্যবেক্ষণের সহায়ক, বিকল্প নয়।')}
];
const GUIDE=[...S.map(s=>({keys:s.keys,title:s.topic,text:s.help,caveat:s.caveat,src:s.src})),{keys:['soil health','mulch','মালচ','মাটির স্বাস্থ্য'],title:B('Protecting soil','মাটি রক্ষা'),text:B('Keeping soil covered and adding organic matter where appropriate can help protect soil and conserve moisture.','মাটি ঢেকে রাখা ও উপযুক্ত ক্ষেত্রে জৈব পদার্থ যোগ করা মাটি রক্ষা ও আর্দ্রতা সংরক্ষণে সাহায্য করতে পারে।'),caveat:B('The right practice depends on soil, crop and local guidance.' , 'সঠিক পদ্ধতি মাটি, ফসল ও স্থানীয় পরামর্শের ওপর নির্ভর করে।'),src:'FAO'}];
let lang='en',screen='home',index=0,picked=null,mythIndex=0,mythPicked=null,usedGuide=false,scores=[0,0],myths=[0,0];const app=document.getElementById('app');const t=o=>o[lang];
function header(){return `<header><b>🚜 ${t(UI.title)}</b><button class="small" onclick="toggleLang()">${lang==='en'?'বাংলা':'English'}</button><button class="small" onclick="openGuide()">🛰️</button></header>`}
function toggleLang(){lang=lang==='en'?'bn':'en';document.documentElement.lang=lang==='en'?'en':'bn';render()}
function progress(n,total){return `<div class="bar" aria-label="Progress"><i style="width:${Math.round(n/total*100)}%"></i></div>`}
function evidence(item){let tone=item.level==='good'?'var(--good)':item.level==='context'?'var(--warn)':'var(--blue)';return `<div class="card evidence" style="--tone:${tone}"><p><span class="tag">${item.level==='good'?(lang==='en'?'Useful practice':'উপকারী পদ্ধতি'):item.level==='context'?(lang==='en'?'Depends on context':'পরিস্থিতিনির্ভর'):(lang==='en'?'Field clue':'জমির সংকেত')}</span> <b>${t(item.topic)}</b></p><p><b>${t(UI.know)}</b><br>${t(item.help)}</p><p><b>${t(UI.not)}</b><br>${t(item.caveat)}</p><p class="muted">${t(UI.sources)}: ${item.src}</p></div>`}
function render(){
 if(screen==='home'){app.innerHTML=header()+`<div class="scene">🌾🚜<small>${t(UI.title)}</small></div><div class="card"><h2>${t(UI.intro)}</h2><p class="muted notice">${t(UI.note)}</p><button class="primary" style="width:100%" onclick="startGame()">${t(UI.start)}</button></div>`;return}
 if(screen==='story'){const s=S[index],choices=s.choices.map((choice,j)=>{let cls='';if(picked!==null){if(choice[1])cls='good';else if(j===picked)cls='bad'}return `<button class="choice ${cls}" ${picked!==null?'disabled':''} onclick="pick(${j})">${t(choice[0])}</button>`}).join('');let feedback=picked===null?'':`<p><b>${s.choices[picked][1]?'✅ '+t(UI.right):'🌱 '+t(UI.wrong)}</b></p>${evidence(s)}<button class="primary" style="width:100%" onclick="nextStory()">${t(UI.next)}</button>`;app.innerHTML=header()+`<div class="scene">${s.icon}<small>${t(s.place)}</small></div>${progress(index+1,S.length+M.length)}<div class="card"><h2>${t(s.question)}</h2></div>${choices}${feedback}`;return}
 if(screen==='myth'){const m=M[mythIndex],answers=[['yes',B('Supported','সমর্থিত')],['qual',B('Needs context','প্রসঙ্গ দরকার')],['no',B('Not established','প্রতিষ্ঠিত নয়')]];const buttons=answers.map(([key,label])=>{let cls='';if(mythPicked){if(key===m.answer)cls='good';else if(key===mythPicked)cls='bad'}return `<button class="choice ${cls}" ${mythPicked?'disabled':''} onclick="answerMyth('${key}')">${t(label)}</button>`}).join('');let feedback=mythPicked?`<div class="card"><b>${mythPicked===m.answer?'✅':'🌿'}</b> ${t(m.why)}</div><button class="primary" style="width:100%" onclick="nextMyth()">${t(UI.next)}</button>`:'';app.innerHTML=header()+`<div class="scene">🔎<small>${t(UI.myths)}</small></div>${progress(S.length+mythIndex+1,S.length+M.length)}<div class="card"><h2>“${t(m.claim)}”</h2></div>${buttons}${feedback}`;return}
 const pct=scores[1]?Math.round(scores[0]/scores[1]*100):0,mpct=myths[1]?Math.round(myths[0]/myths[1]*100):0;app.innerHTML=header()+`<div class="scene">🏆<small>${t(UI.done)}</small></div><div class="card"><h2>${t(UI.score)}</h2><p>${lang==='en'?'Farm decisions':'খামারের সিদ্ধান্ত'}: <b>${pct}%</b></p>${progress(pct,100)}<p>${lang==='en'?'Science claims':'বিজ্ঞানভিত্তিক দাবি'}: <b>${mpct}%</b></p>${progress(mpct,100)}<p>🌱 ${pct>=75?(lang==='en'?'Climate-smart grower':'জলবায়ু-স্মার্ট কৃষক'):(lang==='en'?'Curious grower':'কৌতূহলী কৃষক')}　🛰️ ${usedGuide?(lang==='en'?'Satellite scout':'স্যাটেলাইট অনুসন্ধানী'):''}</p><p class="muted notice">${t(UI.note)}</p></div><button class="primary" style="width:100%" onclick="startGame()">${t(UI.again)}</button>`;
}
function startGame(){index=0;picked=null;mythIndex=0;mythPicked=null;scores=[0,0];myths=[0,0];usedGuide=false;screen='story';render()}
function pick(j){if(picked!==null)return;picked=j;const s=S[index];scores[1]++;scores[0]+=s.choices[j][1];render()}
function nextStory(){picked=null;index++;if(index>=S.length)screen='myth';render()}
function answerMyth(a){if(mythPicked)return;mythPicked=a;myths[1]++;if(a===M[mythIndex].answer)myths[0]++;render()}
function nextMyth(){mythPicked=null;mythIndex++;if(mythIndex>=M.length)screen='finish';render()}
function openGuide(){usedGuide=true;const overlay=document.createElement('div');overlay.id='guide-overlay';overlay.style.cssText='position:fixed;inset:0;background:#0009;z-index:10;overflow:auto;padding:16px';overlay.innerHTML=`<div class="card" style="max-width:650px;margin:20px auto"><h2>${t(UI.ask)}</h2><input id="guide-q" placeholder="${t(UI.question)}" aria-label="${t(UI.question)}"><div class="row" style="margin:10px 0"><button class="primary" onclick="searchGuide()">${t(UI.search)}</button><button onclick="document.getElementById('guide-overlay').remove()">${t(UI.close)}</button></div><div id="guide-results"></div><p class="muted notice">${t(UI.demo)}</p></div>`;document.body.appendChild(overlay);const input=overlay.querySelector('#guide-q');input.focus();input.addEventListener('keydown',e=>{if(e.key==='Enter')searchGuide()})}
function searchGuide(){const value=document.getElementById('guide-q').value.toLowerCase(),matches=GUIDE.filter(x=>x.keys.some(k=>value.includes(k)));document.getElementById('guide-results').innerHTML=matches.length?matches.map(x=>`<div class="card"><b>${t(x.title)}</b><p>${t(x.text)}</p><p class="muted">${t(UI.not)}: ${t(x.caveat)}</p><p class="muted">${t(UI.sources)}: ${x.src}</p></div>`).join(''):`<div class="card">${t(UI.none)}</div>`}
render();
</script></main></body></html>
