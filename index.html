<script>
const B=(en,bn)=>({en,bn});let lang='en',step=-1,selected=null,typing=null,activeMyth=0;
const intro=[B("Hello! I'm Maya. This is my story.",'হ্যালো! আমি মায়া। এটি আমার গল্প।'),B('Cancer is a group of diseases, and learning the evidence helps us make informed choices.','ক্যান্সার অনেক রোগের সমষ্টি। প্রমাণ জানা আমাদের সচেতন সিদ্ধান্ত নিতে সাহায্য করে।'),B("Let's travel through everyday moments and separate strong evidence from myths.",'চলুন দৈনন্দিন কিছু মুহূর্তে যাই, আর শক্ত প্রমাণকে মিথ থেকে আলাদা করি।')];
const S=[
{icon:'🍳',loc:B('KITCHEN · AGE 18','রান্নাঘর · বয়স ১৮'),q:B('Maya wants to reheat leftover lunch. What should she do?','মায়া দুপুরের বেঁচে যাওয়া খাবার গরম করতে চায়। সে কী করবে?'),ch:[[B('Move it to glass or a container labelled microwave-safe','কাচ বা “মাইক্রোওয়েভ-সেফ” লেখা পাত্রে নেবে'),1],[B('Use any old takeaway tub','যেকোনো পুরনো টেকঅ্যাওয়ে বাক্স ব্যবহার করবে'),0],[B('Throw it away: anything touching plastic causes cancer','ফেলে দেবে: প্লাস্টিক ছুঁলেই ক্যান্সার হয়'),0]],level:'CONTEXT-DEPENDENT',top:B('Food-contact materials','খাবারের সংস্পর্শের উপকরণ'),k:B('Whether heating food in a container is appropriate depends on its material and intended use. Check the label.','পাত্রে খাবার গরম করা ঠিক কি না নির্ভর করে তার উপাদান ও ব্যবহারের নির্দেশনার ওপর। লেবেল দেখুন।'),n:B('Not all plastic causes cancer, and different plastics have different intended uses.','সব প্লাস্টিক ক্যান্সার ঘটায় না, বিভিন্ন প্লাস্টিকের ব্যবহারও আলাদা।'),src:'FDA · WHO',keys:['microwave','plastic','container','bottle','মাইক্রোওয়েভ','প্লাস্টিক','পাত্র']},
{icon:'🚭',loc:B('UNIVERSITY · AGE 19','বিশ্ববিদ্যালয় · বয়স ১৯'),q:B('A friend offers Maya a cigarette, then says jorda is “safer.” Maya…','এক বন্ধু মায়াকে সিগারেট দেয়, পরে বলে জর্দা “নিরাপদ”। মায়া…'),ch:[[B('Politely says no to both','দুটোকেই বিনয়ের সাথে না বলে'),1],[B('Tries one cigarette, just once','শুধু একবার একটি সিগারেট খায়'),0],[B('Chews jorda: no smoke means no risk','জর্দা চিবায়: ধোঁয়া নেই, তাই ঝুঁকিও নেই'),0]],level:'ESTABLISHED EVIDENCE',top:B('Tobacco','তামাক'),k:B('Smoked and smokeless tobacco cause several cancers. Second-hand smoke harms others, and quitting lowers risk over time.','ধূমপান ও ধোঁয়াহীন তামাক একাধিক ক্যান্সার ঘটায়। পরোক্ষ ধোঁয়াও ক্ষতিকর, আর ছেড়ে দিলে সময়ের সাথে ঝুঁকি কমে।'),n:B('Smokeless does not mean safe.','ধোঁয়াহীন মানে নিরাপদ নয়।'),src:'WHO · IARC',keys:['tobacco','smok','cigarette','jorda','gul','তামাক','ধূমপান','সিগারেট','জর্দা']},
{icon:'☀️',loc:B('PARK · AGE 19','পার্ক · বয়স ১৯'),q:B('It is midday and Maya will be outside for hours.','দুপুর, মায়া কয়েক ঘণ্টা বাইরে থাকবে।'),ch:[[B('Uses shade, a hat and sunscreen','ছায়া, টুপি ও সানস্ক্রিন ব্যবহার করে'),1],[B('Builds a “base tan” to protect her skin','ত্বক রক্ষায় “বেস ট্যান” তৈরি করে'),0],[B('Assumes darker skin means zero UV risk','গাঢ় ত্বকে ইউভি ঝুঁকি নেই ধরে নেয়'),0]],level:'ESTABLISHED EVIDENCE',top:B('Ultraviolet (UV) radiation','অতিবেগুনি (ইউভি) রশ্মি'),k:B('Excess UV exposure is an established cause of skin cancer. Shade, clothing, hats and sunscreen reduce exposure.','অতিরিক্ত ইউভি রশ্মি ত্বকের ক্যান্সারের প্রতিষ্ঠিত কারণ। ছায়া, পোশাক, টুপি ও সানস্ক্রিন এক্সপোজার কমায়।'),n:B('A tan is not protection, and no one has zero risk.','ট্যান সুরক্ষা নয়, কারও ঝুঁকিই শূন্য নয়।'),src:'WHO · IARC',keys:['sun','uv','skin','tan','সূর্য','রোদ','ত্বক','সানস্ক্রিন']},
{icon:'💉',loc:B('CLINIC · AGE 20','ক্লিনিক · বয়স ২০'),q:B('A clinic runs a vaccination day. Maya hears a rumour that vaccines cause cancer.','ক্লিনিকে টিকা দিবস। মায়া গুজব শোনে—টিকা ক্যান্সার ঘটায়।'),ch:[[B('Asks a clinician which vaccines (HPV, hepatitis B) are recommended for her','চিকিৎসককে জিজ্ঞেস করে তার জন্য কোন টিকা (HPV, হেপাটাইটিস বি) সুপারিশকৃত'),1],[B('Skips it because of the rumour','গুজবের কারণে এড়িয়ে যায়'),0],[B('Believes viruses cannot cause cancer','ভাইরাস ক্যান্সার ঘটাতে পারে না মনে করে'),0]],level:'ESTABLISHED EVIDENCE',top:B('HPV and hepatitis B','HPV ও হেপাটাইটিস বি'),k:B('Persistent HPV infection can cause cervical cancer, and chronic hepatitis B can lead to liver cancer. Vaccines prevent these infections.','দীর্ঘস্থায়ী HPV সংক্রমণ জরায়ুমুখের ক্যান্সার ঘটাতে পারে, আর দীর্ঘমেয়াদি হেপাটাইটিস বি লিভার ক্যান্সারে নিতে পারে। টিকা সংক্রমণ প্রতিরোধ করে।'),n:B('Vaccines do not cause cancer. Schedules vary by country and age.','টিকা ক্যান্সার ঘটায় না। সময়সূচি দেশ ও বয়সভেদে ভিন্ন।'),src:'WHO · IARC',keys:['hpv','vaccin','hepatitis','virus','cervical','টিকা','ভাইরাস','এইচপিভি']},
{icon:'🛒',loc:B('MARKET · AGE 21','বাজার · বয়স ২১'),q:B('Maya plans the week’s meals. Which basket fits the evidence best?','মায়া সপ্তাহের খাবার পরিকল্পনা করছে। কোন ঝুড়িটি প্রমাণের সাথে বেশি মানানসই?'),ch:[[B('Vegetables, fruit, pulses and whole grains','সবজি, ফল, ডাল ও পূর্ণ শস্য'),1],[B('Processed meat as the daily staple','প্রক্রিয়াজাত মাংস প্রতিদিনের প্রধান খাবার'),0],[B('A “superfood” claiming to cure cancer','ক্যান্সার সারানোর দাবিদার “সুপারফুড”'),0]],level:'ESTABLISHED EVIDENCE',top:B('Diet patterns','খাদ্যাভ্যাস'),k:B('Plant-rich diets are linked to lower risk of some cancers. Processed meat is classified as carcinogenic for colorectal cancer.','উদ্ভিজ্জ-সমৃদ্ধ খাদ্য কিছু ক্যান্সারের কম ঝুঁকির সাথে যুক্ত। প্রক্রিয়াজাত মাংস কোলোরেক্টাল ক্যান্সারের জন্য কার্সিনোজেনিক হিসেবে শ্রেণিবদ্ধ।'),n:B('One meal does not cause cancer, and no single food prevents or cures it.','একটি খাবার ক্যান্সার ঘটায় না; কোনো একক খাবার প্রতিরোধ বা নিরাময়ও করে না।'),src:'WHO · IARC · WCRF',keys:['food','diet','meat','sausage','vegetable','fruit','খাবার','মাংস','সবজি']},
{icon:'🏃',loc:B('HOME · AGE 22','বাড়ি · বয়স ২২'),q:B('Maya wants a healthier weekend routine.','মায়া সপ্তাহান্তের রুটিন স্বাস্থ্যকর করতে চায়।'),ch:[[B('Moves most days and limits alcohol','প্রায় প্রতিদিন সক্রিয় থাকে ও অ্যালকোহল সীমিত রাখে'),1],[B('Sits all day and drinks heavily','সারাদিন বসে থাকে ও অতিরিক্ত মদ্যপান করে'),0],[B('Takes supplements instead of exercise','ব্যায়ামের বদলে সাপ্লিমেন্ট নেয়'),0]],level:'ESTABLISHED EVIDENCE',top:B('Activity, weight and alcohol','সক্রিয়তা, ওজন ও অ্যালকোহল'),k:B('Regular activity and a healthy weight lower risk of several cancers. Alcohol is an established cause of several cancers, and risk rises with amount.','নিয়মিত সক্রিয়তা ও স্বাস্থ্যকর ওজন কয়েকটি ক্যান্সারের ঝুঁকি কমায়। অ্যালকোহল একাধিক ক্যান্সারের প্রতিষ্ঠিত কারণ; পরিমাণ বাড়লে ঝুঁকি বাড়ে।'),n:B('Lower risk is not zero risk.','ঝুঁকি কম মানে ঝুঁকিহীন নয়।'),src:'WHO · IARC',keys:['alcohol','exercise','weight','activity','obes','মদ','ব্যায়াম','ওজন']},

function skipIntro(){step=0;showStep()}
function advanceIntro(){if(step>=0)return;clearInterval(typing);typing=null;step++;if(step+1<intro.length){setText(T(intro[step+1]))}else{step=0;showStep()}}
function showStep(){selected=null;let s=S[step];document.getElementById('sceneLabel').textContent=T(s.loc);document.getElementById('speaker').textContent='MAYA';document.getElementById('dialog').classList.remove('hide');document.getElementById('choices').classList.add('hide');document.getElementById('evidence').classList.add('hide');document.getElementById('tap').classList.add('hide');setText(T(s.q),false);let p=Math.round((step+1)/(S.length+M.length)*100);document.getElementById('progress').style.width=p+'%';mayaSprite();setTimeout(()=>{if(step<S.length&&selected===null)showChoices()},Math.min(1800,Math.max(450,T(s.q).length*14)))}
function showChoices(){if(step>=S.length)return;let d=document.getElementById('choices'),s=S[step];d.innerHTML=s.ch.map((x,j)=>`<button class="choice" onclick="choose(${j})">${T(x[0])}</button>`).join('');d.classList.remove('hide')}
function choose(j){if(selected!==null)return;selected=j;let s=S[step],right=s.ch[j][1];choiceScore[1]++;if(right)choiceScore[0]++;let buttons=document.querySelectorAll('.choice');buttons.forEach((b,k)=>{b.disabled=true;if(s.ch[k][1])b.classList.add('correct');else if(k===j)b.classList.add('wrong')});let head=right?(lang==='en'?'✓ GOOD CHOICE':'✓ ভালো সিদ্ধান্ত'):(lang==='en'?'↻ TRY ANOTHER WAY':'↻ অন্য উপায় ভাবুন');document.getElementById('speaker').textContent=head;document.getElementById('line').textContent=right?(lang==='en'?'Let’s check the evidence behind Maya’s choice.':'মায়ার সিদ্ধান্তের পেছনের প্রমাণ দেখি।'):(lang==='en'?'No single choice defines someone’s future. Here is what the evidence says.':'একটি সিদ্ধান্ত কারও ভবিষ্যৎ নির্ধারণ করে না। প্রমাণ কী বলে দেখি।');document.getElementById('dialog').classList.remove('hide');document.getElementById('tap').classList.add('hide');let e=document.getElementById('evidence');e.innerHTML=`<h2>${T(s.top)}</h2><p><span class="tag">${s.level}</span></p><p><b>${lang==='en'?'WHAT WE KNOW':'আমরা যা জানি'}</b><br>${T(s.k)}</p><p><b>${lang==='en'?'WHAT THIS DOES NOT MEAN':'এর মানে যা নয়'}</b><br>${T(s.n)}</p><p class="muted">${lang==='en'?'SOURCES':'উৎস'}: ${s.src}</p><button onclick="nextStep()">${lang==='en'?'CONTINUE »':'এগিয়ে চলুন »'}</button>`;e.classList.remove('hide')}
function nextStep(){document.getElementById('evidence').classList.add('hide');document.getElementById('choices').classList.add('hide');step++;if(step<S.length)showStep();else showMyths()}
function showMyths(){document.getElementById('sceneLabel').textContent=lang==='en'?'MYTH DETECTOR':'মিথ যাচাই';document.getElementById('speaker').textContent='EVIDENCE CHALLENGE';document.getElementById('dialog').classList.remove('hide');let d=document.getElementById('choices');d.classList.remove('hide');document.getElementById('progress').style.width=Math.round((S.length+1)/(S.length+M.length)*100)+'%';showMyth(0)}
function showMyth(i){if(i>=M.length){activeMyth=M.length;renderFinish();return}activeMyth=i;let m=M[i];document.getElementById('line').textContent='“'+T(m.c)+'”';document.getElementById('choices').innerHTML=[['yes',B('SUPPORTED','সমর্থিত')],['qual',B('NEEDS QUALIFICATION','শর্তসাপেক্ষ')],['no',B('NOT ESTABLISHED','প্রতিষ্ঠিত নয়')]].map(([k,l])=>`<button class="choice" onclick="mythAnswer(${i},'${k}')">${T(l)}</button>`).join('');document.getElementById('tap').classList.add('hide')}
function mythAnswer(i,a){let m=M[i];mythScore[1]++;if(a===m.a)mythScore[0]++;document.querySelectorAll('#choices .choice').forEach((b,k)=>{b.disabled=true;let key=['yes','qual','no'][k];if(key===m.a)b.classList.add('correct');else if(key===a)b.classList.add('wrong')});let e=document.getElementById('evidence');e.innerHTML=`<h2>${a===m.a?'✓':'↻'} ${lang==='en'?'EVIDENCE CHECK':'প্রমাণ যাচাই'}</h2><p>${T(m.w)}</p><button onclick="mythNext(${i})">${lang==='en'?'NEXT CLAIM »':'পরের দাবি »'}</button>`;e.classList.remove('hide')}
function mythNext(i){document.getElementById('evidence').classList.add('hide');showMyth(i+1);document.getElementById('progress').style.width=Math.round((S.length+i+2)/(S.length+M.length)*100)+'%'}
function renderFinish(){step=S.length+M.length;let choicePct=Math.round(choiceScore[0]/choiceScore[1]*100)||0,mythPct=Math.round(mythScore[0]/mythScore[1]*100)||0;document.getElementById('sceneLabel').textContent=lang==='en'?'JOURNEY COMPLETE':'যাত্রা সম্পূর্ণ';document.getElementById('speaker').textContent='MAYA';document.getElementById('line').textContent=lang==='en'?"Thanks for learning with me! Keep asking what the evidence says.":'আমার সাথে শেখার জন্য ধন্যবাদ! প্রমাণ কী বলে তা জানতে থাকুন।';document.getElementById('tap').classList.add('hide');let e=document.getElementById('evidence');e.innerHTML=`<h2>${lang==='en'?'YOUR JOURNEY RECAP':'আপনার যাত্রার সারাংশ'}</h2><p>${lang==='en'?'Everyday choices':'দৈনন্দিন সিদ্ধান্ত'}: <b>${choiceScore[0]}/${choiceScore[1]} (${choicePct}%)</b></p><p>${lang==='en'?'Evidence challenges':'প্রমাণ যাচাই'}: <b>${mythScore[0]}/${mythScore[1]} (${mythPct}%)</b></p><p>${lang==='en'?'Key takeaways':'মূল শিক্ষা'}:</p><p>🎗 ${lang==='en'?'Risk can be lowered, not made zero.':'ঝুঁকি কমানো যায়, শূন্য করা যায় না।'}<br>🔬 ${lang==='en'?'Check the strength and context of a claim.':'দাবির প্রমাণ ও প্রেক্ষাপট যাচাই করুন।'}<br>🩺 ${lang==='en'?'Ask a qualified health professional about symptoms, screening and personal risk.':'উপসর্গ, স্ক্রিনিং ও ব্যক্তিগত ঝুঁকির জন্য যোগ্য স্বাস্থ্যকর্মীর পরামর্শ নিন।'}</p><p class="muted">${lang==='en'?'Education only · Not medical advice or a diagnosis':'শুধু শিক্ষামূলক · চিকিৎসা পরামর্শ বা রোগ নির্ণয় নয়'}</p>`;e.classList.remove('hide');document.getElementById('choices').innerHTML=`<button class="choice correct" onclick="restart()">🏆 ${lang==='en'?'PLAY AGAIN':'আবার খেলুন'}</button><button class="choice" onclick="openGuide()">🔬 ${lang==='en'?'OPEN EVIDENCE GUIDE':'প্রমাণ নির্দেশিকা'}</button>`;document.getElementById('choices').classList.remove('hide');document.getElementById('progress').style.width='100%'}
function restart(){clearInterval(typing);step=-1;activeMyth=0;choiceScore=[0,0];mythScore=[0,0];document.getElementById('sceneLabel').textContent=lang==='en'?"MAYA'S STORY":'মায়ার গল্প';document.getElementById('speaker').textContent='MAYA';document.getElementById('choices').classList.add('hide');document.getElementById('evidence').classList.add('hide');document.getElementById('progress').style.width='0%';document.getElementById('tap').classList.remove('hide');setText(T(intro[0]));mayaSprite()}
function openGuide(){let shade=document.createElement('div');shade.className='shade';shade.id='shade';shade.innerHTML=`<div class="guide"><h2>🔬 ${lang==='en'?'ASK THE EVIDENCE GUIDE':'প্রমাণ নির্দেশিকাকে জিজ্ঞেস করুন'}</h2><input id="ask" placeholder="${lang==='en'?'Try tobacco, sun, HPV, screening, plastic…':'তামাক, রোদ, HPV, স্ক্রিনিং, প্লাস্টিক লিখুন…'}"><div><button onclick="answerGuide()">${lang==='en'?'SEARCH':'খুঁজুন'}</button><button onclick="document.getElementById('shade').remove()">${lang==='en'?'CLOSE':'বন্ধ'}</button></div><div class="guideout" id="guideout"></div><p class="muted">${lang==='en'?'Demo answers come from the reviewed entries in this game, not a live AI model.':'ডেমোর উত্তর গেমের পর্যালোচিত তথ্য থেকে আসে, লাইভ AI মডেল থেকে নয়।'}</p></div>`;document.getElementById('game').appendChild(shade);document.getElementById('ask').focus();document.getElementById('ask').addEventListener('keydown',e=>{if(e.key==='Enter')answerGuide()})}
function answerGuide(){let q=document.getElementById('ask').value.toLowerCase(),found=S.filter(s=>s.keys.some(k=>q.includes(k))),o=document.getElementById('guideout');if(/do i have|diagnos|my lump|i have cancer|treatment|আমার কি ক্যান্সার|চিকিৎসা|রোগ নির্ণয়/.test(q)){o.innerHTML=`<p>${lang==='en'?"I can't diagnose or assess personal risk. Please talk to a doctor or health worker.":'আমি রোগ নির্ণয় বা ব্যক্তিগত ঝুঁকি বলতে পারি না। চিকিৎসক বা স্বাস্থ্যকর্মীর সাথে কথা বলুন।'}</p>`;return}o.innerHTML=found.length?found.map(s=>`<article><h2>${T(s.top)}</h2><p>${T(s.k)}</p><p><b>${lang==='en'?'Keep in mind':'মনে রাখুন'}:</b> ${T(s.n)}</p><p>${s.src}</p></article>`).join(''):`<p>${lang==='en'?'No matching entry. Try tobacco, sun, HPV, food, alcohol, work, screening, or plastic.':'মিল পাওয়া যায়নি। তামাক, রোদ, HPV, খাবার, মদ, কাজ, স্ক্রিনিং বা প্লাস্টিক লিখুন।'}`}
function showStepFromIntro(){step=-1;document.getElementById('tap').classList.remove('hide');setText(T(intro[0]))}
mayaSprite();showStepFromIntro();
</script></body></html>
